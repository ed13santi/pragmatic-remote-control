[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pragmatic-rc"
version = "0.1.0"
description = "Reimplementation of pull-based and push-based pragmatic communication for remote control of finite-state Markov processes"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Edoardo David Santi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
neural = ["torch>=2.0"]
mujoco = ["torch>=2.0", "stable-baselines3>=2.0", "gymnasium[mujoco]>=0.29", "imageio>=2.0"]
ppo = ["torch>=2.0", "stable-baselines3>=2.0", "gymnasium>=0.29", "imageio>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
